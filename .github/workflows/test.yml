name: Conan Windows Env Vars Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Verify Python Installation
        run: |
          python --version
          python -m pip --version
      
      - name: Install CMake 3.31.6 and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Verify CMake Installation
        run: cmake --version
      
      - name: Install Visual Studio Build Tools 2022
        run: |
          choco install visualstudio2022buildtools --packageParameters "--add Microsoft.VisualStudio.Workload.NativeDesktop --passive --norestart" || true
      
      - name: Install Conan 2.24.0 via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Verify Conan Installation
        run: |
          python -m pip show conan
          Write-Host "======================================================"
          Write-Host "Checking conan executable in PATH..."
          where.exe conan
      
      - name: Test conan command
        run: |
          conan --version
      
      - name: Detect Conan Profile
        run: |
          conan profile detect --force
      
      - name: Run Single Test
        run: |
          conan create . --build=missing
      
      - name: Run Stress Test (30 iterations)
        run: |
          python test_runner.py --runs 30
        continue-on-error: true
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.json
