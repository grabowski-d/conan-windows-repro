name: Conan Windows Env Vars Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of test iterations'
        required: false
        default: '50'
  schedule:
    # Run every hour to catch intermittent issues
    - cron: '0 * * * *'

jobs:
  # Fast smoke test - runs on every commit
  quick-test:
    runs-on: windows-2022
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Single Quick Test
        run: |
          Write-Host "Running single conan create test..."
          conan create . --build=missing
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Conan create failed - environment variables may be missing!"
            exit 1
          }
          Write-Host "::notice::Quick test passed!"

  # Stress test - runs many iterations
  stress-test:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: quick-test
    
    strategy:
      matrix:
        # Run multiple parallel jobs to increase chances of catching the issue
        runner: [1, 2, 3]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Run Stress Test
        run: |
          $iterations = if ($env:ITERATIONS) { $env:ITERATIONS } else { "100" }
          Write-Host "Running $iterations iterations on runner ${{ matrix.runner }}..."
          python test_runner.py --runs $iterations
        env:
          ITERATIONS: ${{ github.event.inputs.iterations }}
        continue-on-error: true
      
      - name: Check for Failures
        run: |
          if (Test-Path test_results.json) {
            $results = Get-Content test_results.json | ConvertFrom-Json
            if ($results.failures -gt 0) {
              Write-Host "::error::Found $($results.failures) failures out of $($results.total_runs) runs!"
              Write-Host "::error::Failure rate: $($results.failure_rate)"
              exit 1
            } else {
              Write-Host "::notice::All $($results.total_runs) runs succeeded!"
            }
          } else {
            Write-Host "::warning::No test results file found"
          }
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-runner-${{ matrix.runner }}
          path: |
            test_results.json
            test_results_*.log

  # Continuous test - runs very frequently with minimal setup
  continuous-fast-test:
    runs-on: windows-2022
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Rapid Fire Test (200 iterations)
        run: |
          Write-Host "Starting rapid-fire testing..."
          $startTime = Get-Date
          
          for ($i = 1; $i -le 200; $i++) {
            Write-Host "Iteration $i/200..."
            
            # Run conan create and capture output
            $output = conan create . --build=missing 2>&1 | Out-String
            
            # Check for missing environment variables in output
            if ($output -match "MISSING|NOT FOUND|CRITICAL MISSING") {
              Write-Host "::error::Environment variable issue detected at iteration $i!"
              Write-Host "Output: $output"
              
              # Save failure details
              @{
                iteration = $i
                timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
                output = $output
              } | ConvertTo-Json | Out-File "failure_$i.json"
              
              exit 1
            }
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Conan create failed at iteration $i!"
              Write-Host "Output: $output"
              exit 1
            }
            
            # Quick check every 10 iterations
            if ($i % 10 -eq 0) {
              $elapsed = (Get-Date) - $startTime
              $avgTime = $elapsed.TotalSeconds / $i
              Write-Host "::notice::Completed $i iterations in $($elapsed.TotalSeconds)s (avg: ${avgTime}s per iteration)"
            }
          }
          
          $totalTime = (Get-Date) - $startTime
          Write-Host "::notice::All 200 iterations completed successfully in $($totalTime.TotalSeconds)s!"
      
      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: failure_*.json
