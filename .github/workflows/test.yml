name: Conan Windows Env Vars Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Verify Python Installation
        run: |
          python --version
          python -m pip --version
      
      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmake-version: 3.31.6
      
      - name: Verify CMake Installation
        run: cmake --version
      
      - name: Install Visual Studio Build Tools 2022
        run: |
          choco install visualstudio2022buildtools --packageParameters "--add Microsoft.VisualStudio.Workload.NativeDesktop --passive --norestart" || true
      
      - name: Install Conan 2.24.0 via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Verify Conan Installation and PATH
        run: |
          python -m pip show conan
          Write-Host "Checking for conan in PATH..."
          where.exe conan || Write-Host "conan not in PATH, checking via Python..."
          python -c "from conans import __version__; print(f'Conan Python module version: {__version__}')"
      
      - name: Test conan command
        run: |
          conan --version
        continue-on-error: true
      
      - name: Test conan via python module
        run: |
          python -c "from conans.cli import main_cli; main_cli(['--version'])"
        continue-on-error: true
      
      - name: Detect Conan Profile
        run: |
          conan profile detect --force
      
      - name: Run Single Test
        run: |
          conan create . --build=missing
      
      - name: Run Stress Test (10 iterations)
        run: |
          python test_runner.py --runs 10
        continue-on-error: true
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.json
