name: Advanced Conan Environment Testing

on:
  push:
    branches: [ main ]
    paths:
      - 'conanfile_advanced.py'
      - '.github/workflows/advanced-test.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of test iterations'
        required: false
        default: '500'
      shell_type:
        description: 'Shell to use (pwsh, cmd, bash)'
        required: false
        default: 'pwsh'

jobs:
  # Test with PowerShell (default)
  powershell-test:
    runs-on: windows-2022
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Rapid Iteration Test (PowerShell)
        shell: pwsh
        run: |
          $iterations = if ($env:ITERATIONS) { [int]$env:ITERATIONS } else { 500 }
          Write-Host "Running $iterations iterations with PowerShell..."
          
          $failures = @()
          $startTime = Get-Date
          
          for ($i = 1; $i -le $iterations; $i++) {
            $output = conan create . --name=mypkg --version=1.0 -sf=conanfile_advanced.py 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            
            # Check for critical issues
            if ($output -match "CRITICAL MISSING|RACE CONDITION DETECTED|TEST RESULT: FAILURE") {
              Write-Host "::error::Issue detected at iteration $i!"
              $failures += @{
                iteration = $i
                type = "environment_issue"
                output = $output
              }
            }
            
            # Report progress
            if ($i % 50 -eq 0) {
              $elapsed = (Get-Date) - $startTime
              $rate = $i / $elapsed.TotalSeconds
              Write-Host "Progress: $i/$iterations ($([int]($i/$iterations*100))%) - Rate: $([math]::Round($rate, 2)) iter/sec - Failures: $($failures.Count)"
            }
          }
          
          $totalTime = (Get-Date) - $startTime
          Write-Host ""
          Write-Host "="*80
          Write-Host "Completed $iterations iterations in $($totalTime.TotalSeconds)s"
          Write-Host "Total failures: $($failures.Count) ($([math]::Round($failures.Count/$iterations*100, 2))%)"
          Write-Host "="*80
          
          if ($failures.Count -gt 0) {
            Write-Host "::error::Found $($failures.Count) failures!"
            
            # Save detailed failure info
            $failures | ConvertTo-Json -Depth 10 | Out-File "failures_pwsh.json"
            
            # Show first few failures
            for ($i = 0; $i -lt [Math]::Min(3, $failures.Count); $i++) {
              Write-Host "::group::Failure $($i+1) at iteration $($failures[$i].iteration)"
              Write-Host $failures[$i].output
              Write-Host "::endgroup::"
            }
            
            exit 1
          } else {
            Write-Host "::notice::SUCCESS - No environment issues detected in PowerShell!"
          }
        env:
          ITERATIONS: ${{ github.event.inputs.iterations }}
      
      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-powershell
          path: failures_*.json

  # Test with CMD (Windows Command Prompt)
  cmd-test:
    runs-on: windows-2022
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Rapid Iteration Test (CMD)
        shell: cmd
        run: |
          @echo off
          echo Running iterations with CMD...
          set FAILURES=0
          set ITERATIONS=200
          
          for /L %%i in (1,1,%ITERATIONS%) do (
            conan create . --name=mypkg --version=1.0 -sf=conanfile_advanced.py > output_%%i.txt 2>&1
            
            findstr /C:"CRITICAL MISSING" /C:"RACE CONDITION" /C:"TEST RESULT: FAILURE" output_%%i.txt > nul
            if not errorlevel 1 (
              echo ::error::Issue detected at iteration %%i
              set /A FAILURES+=1
            )
            
            rem Progress every 50 iterations
            set /A MOD=%%i %% 50
            if !MOD!==0 echo Progress: %%i/%ITERATIONS% - Failures: !FAILURES!
          )
          
          echo.
          echo ================================================================================
          echo Completed %ITERATIONS% iterations
          echo Total failures: %FAILURES%
          echo ================================================================================
          
          if %FAILURES% GTR 0 (
            echo ::error::Found %FAILURES% failures in CMD environment!
            exit /b 1
          ) else (
            echo ::notice::SUCCESS - No environment issues detected in CMD!
          )
      
      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-cmd
          path: output_*.txt

  # Test with Git Bash (mimics your GitLab environment)
  bash-test:
    runs-on: windows-2022
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Rapid Iteration Test (Git Bash)
        shell: bash
        run: |
          echo "Running iterations with Git Bash (MSYS2)..."
          FAILURES=0
          ITERATIONS=200
          
          for ((i=1; i<=ITERATIONS; i++)); do
            output=$(conan create . --name=mypkg --version=1.0 -sf=conanfile_advanced.py 2>&1)
            
            # Check for critical issues - fixed regex
            if echo "$output" | grep -E "CRITICAL MISSING|RACE CONDITION|TEST RESULT: FAILURE" > /dev/null 2>&1; then
              echo "::error::Issue detected at iteration $i!"
              echo "$output" > "failure_bash_$i.txt"
              ((FAILURES++))
            fi
            
            # Progress every 50 iterations
            if [ $((i % 50)) -eq 0 ]; then
              echo "Progress: $i/$ITERATIONS - Failures: $FAILURES"
            fi
          done
          
          echo ""
          echo "================================================================================"
          echo "Completed $ITERATIONS iterations with Git Bash"
          echo "Total failures: $FAILURES out of $ITERATIONS"
          echo "================================================================================"
          
          if [ $FAILURES -gt 0 ]; then
            echo "::error::Found $FAILURES failures in Git Bash environment!"
            echo "::error::This matches your GitLab Runner environment (Git Bash)!"
            exit 1
          else
            echo "::notice::SUCCESS - No environment issues detected in Git Bash!"
          fi
      
      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-bash
          path: failure_bash_*.txt

  # Parallel stress test
  parallel-stress-test:
    runs-on: windows-2022
    timeout-minutes: 45
    
    strategy:
      matrix:
        instance: [1, 2, 3, 4]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.7'
      
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: latest
      
      - name: Install Conan 2.24.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.24.0
      
      - name: Detect Conan Profile
        run: conan profile detect --force
      
      - name: Parallel Stress Test Instance ${{ matrix.instance }}
        run: |
          Write-Host "Running parallel instance ${{ matrix.instance }}..."
          
          $failures = 0
          for ($i = 1; $i -le 100; $i++) {
            $output = conan create . --name=mypkg --version=1.0 -sf=conanfile_advanced.py 2>&1 | Out-String
            
            if ($output -match "CRITICAL MISSING|RACE CONDITION|TEST RESULT: FAILURE") {
              $failures++
              Write-Host "::error::Instance ${{ matrix.instance }} - Failure at iteration $i"
            }
            
            if ($i % 25 -eq 0) {
              Write-Host "Instance ${{ matrix.instance }}: $i/100 - Failures: $failures"
            }
          }
          
          Write-Host ""
          Write-Host "Instance ${{ matrix.instance }} completed: $failures failures out of 100"
          
          if ($failures -gt 0) {
            exit 1
          } else {
            Write-Host "::notice::Instance ${{ matrix.instance }} - SUCCESS!"
          }
