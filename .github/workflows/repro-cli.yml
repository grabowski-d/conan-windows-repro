name: Repro CLI

# Same problem reproduced with the regular Conan CLI: local conan_server +
# `conan install` downloading packages in parallel threads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NO_PROXY: localhost,127.0.0.1,.example.com
  PYTHONUNBUFFERED: "1"

jobs:
  # clean_system_proxy=True, switch interval 1e-6. Expected to FAIL (reproduced).
  cli-original:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install conan==2.32.0 conan-server==2.32.0
      - run: python cli/repro_cli.py --runs 20 --keep-going

  # Default interpreter switch interval (5 ms), core.download:parallel=8.
  # Shows the problem without any interpreter tweaks. Expected to FAIL.
  cli-default-switch:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install conan==2.32.0 conan-server==2.32.0
      - run: python cli/repro_cli.py --runs 40 --keep-going --parallel 8 --switch-interval 0.005

  # Same as cli-original but clean_system_proxy=False. Expected to pass.
  cli-control:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install conan==2.32.0 conan-server==2.32.0
      - run: python cli/repro_cli.py --runs 20 --keep-going --control
